<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .tier-card { fill: #131c2e; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .tier-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.05em; }
      .host { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 8px; }
      .host-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .host-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .host-code { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 600; fill: #10b981; }
      .net-arrow { stroke: #0284c7; stroke-width: 2.2; fill: none; marker-end: url(#arrow-cyan); }
      .db-arrow { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .ext-arrow { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-amber); }
    </style>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1200" height="800" class="bg" />

  <!-- Header -->
  <text x="45" y="45" class="title">Farm Connect — Production Deployment Architecture</text>
  <text x="45" y="68" class="subtitle">Complete topology of edge distribution, containerized compute, managed PostgreSQL, and external API gateways</text>

  <!-- ================= TIER 1: VERCEL EDGE ================= -->
  <g transform="translate(45, 95)">
    <rect width="350" height="660" class="tier-card" />
    <text x="20" y="32" class="tier-title">TIER 1: FRONTEND (VERCEL EDGE)</text>

    <!-- Client -->
    <g transform="translate(18, 50)">
      <rect width="314" height="120" class="host" />
      <text x="14" y="24" class="host-title">End-User Client Devices</text>
      <text x="14" y="44" class="host-desc">• Karnataka Consumers (Browsers / Mobile)</text>
      <text x="14" y="62" class="host-desc">• Local Cultivators (Mobile PWA / Storefront)</text>
      <text x="14" y="80" class="host-desc">• Platform Administrators</text>
      <text x="14" y="102" class="host-code">Protocol: HTTPS / TLS 1.3</text>
    </g>

    <!-- Vercel Network -->
    <g transform="translate(18, 190)">
      <rect width="314" height="230" class="host" style="stroke: #0284c7;" />
      <text x="14" y="24" class="host-title">Vercel Edge Global Network</text>
      <text x="14" y="44" class="host-desc">Frontend Production Host: Next.js 16 App Router</text>
      <text x="14" y="64" class="host-desc">• Domain: farm-connect-eta-ten.vercel.app</text>
      <text x="14" y="84" class="host-desc">• Edge PoP in India / Mumbai Region</text>
      <text x="14" y="104" class="host-desc">• Automatic Brotli compression of assets</text>
      <text x="14" y="124" class="host-desc">• Caches immutable static JS/CSS chunks</text>
      <text x="14" y="144" class="host-desc">• Dynamic SSR execution at edge nodes</text>
      <text x="14" y="164" class="host-desc">• Configured via NEXT_PUBLIC_API_URL</text>
      <text x="14" y="194" class="host-code">Vercel CI/CD Build</text>
    </g>

    <!-- CI/CD Webhook -->
    <g transform="translate(18, 440)">
      <rect width="314" height="190" class="host" />
      <text x="14" y="24" class="host-title">GitHub main Branch Triggers</text>
      <text x="14" y="44" class="host-desc">• Continuous Deployment pipeline</text>
      <text x="14" y="64" class="host-desc">• Git push origin main fires webhooks</text>
      <text x="14" y="84" class="host-desc">• Zero-downtime rolling deploys</text>
      <text x="14" y="104" class="host-desc">• Automated smoke tests verify health check</text>
      <text x="14" y="134" class="host-code">GitHub Webhook</text>
    </g>
  </g>

  <!-- Connect 1 to 2 -->
  <path d="M 395, 305 L 435, 305" class="net-arrow" />
  <text x="400" y="295" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8">REST</text>

  <!-- ================= TIER 2: RENDER HOST ================= -->
  <g transform="translate(435, 95)">
    <rect width="350" height="660" class="tier-card" />
    <text x="20" y="32" class="tier-title">TIER 2: BACKEND (RENDER CONTAINER)</text>

    <!-- Render Web Service -->
    <g transform="translate(18, 50)">
      <rect width="314" height="260" class="host" style="stroke: #10b981;" />
      <text x="14" y="24" class="host-title">Render Web Service Container</text>
      <text x="14" y="44" class="host-desc">Backend Host: Node.js / Express 5 API</text>
      <text x="14" y="64" class="host-desc">• Port: 5000 (Internal) exposed via HTTPS proxy</text>
      <text x="14" y="84" class="host-desc">• Proxy Trust: app.set('trust proxy', 1)</text>
      <text x="14" y="104" class="host-desc">• CORS Whitelist: farm-connect-eta-ten.vercel.app</text>
      <text x="14" y="124" class="host-desc">• Express Rate Limiter: 300 req / 15m window</text>
      <text x="14" y="144" class="host-desc">• Health Probe: GET /health (Status 200)</text>
      <text x="14" y="164" class="host-desc">• Auto-restarts on uncaught process exceptions</text>
      <text x="14" y="184" class="host-desc">• Morgan logging streamed to Render dashboard</text>
      <text x="14" y="224" class="host-code">Render Web Service</text>
    </g>

    <!-- Secure Vault -->
    <g transform="translate(18, 330)">
      <rect width="314" height="300" class="host" />
      <text x="14" y="24" class="host-title">Secure Environment Boundaries</text>
      <text x="14" y="44" class="host-desc">Injected via encrypted cloud environment vault:</text>
      <text x="14" y="68" font-family="monospace" font-size="10" fill="#34d399">• DATABASE_URL (PostgreSQL SSL)</text>
      <text x="14" y="90" font-family="monospace" font-size="10" fill="#34d399">• JWT_SECRET &amp; JWT_EXPIRES_IN</text>
      <text x="14" y="112" font-family="monospace" font-size="10" fill="#34d399">• FAST2SMS_API_KEY</text>
      <text x="14" y="134" font-family="monospace" font-size="10" fill="#34d399">• CLOUDINARY_URL</text>
      <text x="14" y="156" font-family="monospace" font-size="10" fill="#34d399">• ALLOWED_ORIGINS</text>
      <text x="14" y="178" font-family="monospace" font-size="10" fill="#34d399">• NODE_ENV=production</text>
      <text x="14" y="210" class="host-desc">Zero credentials committed to Git repository</text>
      <text x="14" y="230" class="host-desc">.gitignore blocks all .env and secret files</text>
      <text x="14" y="260" class="host-code">Render Environment Vault</text>
    </g>
  </g>

  <!-- Connect 2 to 3 -->
  <path d="M 785, 220 L 825, 220" class="db-arrow" />
  <text x="790" y="210" font-family="sans-serif" font-size="9" font-weight="700" fill="#10b981">TCP</text>

  <path d="M 785, 450 L 825, 450" class="ext-arrow" />
  <text x="790" y="440" font-family="sans-serif" font-size="9" font-weight="700" fill="#f59e0b">HTTP</text>

  <!-- ================= TIER 3: SUPABASE & THIRD PARTY ================= -->
  <g transform="translate(825, 95)">
    <rect width="330" height="660" class="tier-card" />
    <text x="20" y="32" class="tier-title">TIER 3: DATA &amp; EXTERNAL SERVICES</text>

    <!-- Supabase -->
    <g transform="translate(18, 50)">
      <rect width="294" height="190" class="host" style="stroke: #10b981;" />
      <text x="14" y="24" class="host-title">Supabase Managed Database</text>
      <text x="14" y="44" class="host-desc">Engine: PostgreSQL 15 (AWS ap-south-1)</text>
      <text x="14" y="64" class="host-desc">• SSL Enforced (rejectUnauthorized: false)</text>
      <text x="14" y="84" class="host-desc">• Connection Pool: max 10 clients</text>
      <text x="14" y="104" class="host-desc">• Spatial Proc: calculate_distance_km()</text>
      <text x="14" y="124" class="host-desc">• Daily automated snapshots</text>
      <text x="14" y="154" class="host-code">Port :5432 (TCP Encrypted)</text>
    </g>

    <!-- Fast2SMS -->
    <g transform="translate(18, 260)">
      <rect width="294" height="150" class="host" style="stroke: #f59e0b;" />
      <text x="14" y="24" class="host-title">Fast2SMS Gateway</text>
      <text x="14" y="44" class="host-desc">Bulk V2 SMS Gateway</text>
      <text x="14" y="64" class="host-desc">• Dispatches 6-digit OTPs to mobile carriers</text>
      <text x="14" y="84" class="host-desc">• Route: "otp" with dynamic variables</text>
      <text x="14" y="104" class="host-desc">• Dev bypass: OTP_DEMO_MODE=true</text>
      <text x="14" y="128" class="host-code">HTTPS: fast2sms.com</text>
    </g>

    <!-- Cloudinary -->
    <g transform="translate(18, 430)">
      <rect width="294" height="150" class="host" style="stroke: #f59e0b;" />
      <text x="14" y="24" class="host-title">Cloudinary Media CDN</text>
      <text x="14" y="44" class="host-desc">Global Media Storage</text>
      <text x="14" y="64" class="host-desc">• Stores farmer produce crop photos</text>
      <text x="14" y="84" class="host-desc">• Auto-conversion to modern WebP format</text>
      <text x="14" y="104" class="host-desc">• Next.js Image component optimized</text>
      <text x="14" y="128" class="host-code">HTTPS: res.cloudinary.com</text>
    </g>
  </g>

</svg>
