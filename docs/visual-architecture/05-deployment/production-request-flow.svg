<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stage-card { fill: #131c2e; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.05em; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 8px; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .box-code { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 600; fill: #10b981; }
      .flow-arrow { stroke: #0284c7; stroke-width: 2.2; fill: none; marker-end: url(#arrow-cyan); }
    </style>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1200" height="800" class="bg" />

  <!-- Header -->
  <text x="45" y="45" class="title">Farm Connect — Production Live Request Flow &amp; Network Ingestion</text>
  <text x="45" y="68" class="subtitle">Packet and protocol trace traversing Vercel Edge PoP, Render reverse proxy, Node.js listener, and Supabase AWS Mumbai</text>

  <!-- ================= STAGE 1: CLIENT TO VERCEL ================= -->
  <g transform="translate(45, 95)">
    <rect width="260" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">1. VERCEL EDGE POP</text>

    <!-- 1.1 -->
    <g transform="translate(15, 50)">
      <rect width="230" height="130" class="box" />
      <text x="12" y="22" class="box-title">Client Browser (Karnataka)</text>
      <text x="12" y="40" class="box-desc">• User navigates to web URL</text>
      <text x="12" y="56" class="box-desc">• DNS resolves to Vercel Anycast</text>
      <text x="12" y="72" class="box-desc">• TLS 1.3 Handshake completed</text>
      <text x="12" y="88" class="box-desc">• Edge terminates SSL in Mumbai</text>
      <text x="12" y="108" class="box-code">HTTP/2 / TLS 1.3</text>
    </g>

    <!-- 1.2 -->
    <g transform="translate(15, 200)">
      <rect width="230" height="140" class="box" />
      <text x="12" y="22" class="box-title">Static Assets vs SSR</text>
      <text x="12" y="40" class="box-desc">• Cached JS/CSS chunks served</text>
      <text x="12" y="56" class="box-desc">  directly from edge cache</text>
      <text x="12" y="72" class="box-desc">• React 19 hydration payload</text>
      <text x="12" y="88" class="box-desc">  compiled to browser</text>
      <text x="12" y="104" class="box-desc">• Zero latency static hit</text>
      <text x="12" y="124" class="box-code">Edge Cache HIT</text>
    </g>

    <!-- 1.3 -->
    <g transform="translate(15, 360)">
      <rect width="230" height="130" class="box" />
      <text x="12" y="22" class="box-title">Client API Request</text>
      <text x="12" y="40" class="box-desc">• Axios client makes REST call</text>
      <text x="12" y="56" class="box-desc">• Target: Render backend host</text>
      <text x="12" y="72" class="box-desc">• Injects Bearer JWT token</text>
      <text x="12" y="88" class="box-desc">• Cross-Origin request over TLS</text>
      <text x="12" y="108" class="box-code">CORS Preflight</text>
    </g>
  </g>
  <path d="M 305, 400 L 335, 400" class="flow-arrow" />

  <!-- ================= STAGE 2: RENDER PROXY ================= -->
  <g transform="translate(335, 95)">
    <rect width="260" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">2. RENDER PROXY</text>

    <!-- 2.1 -->
    <g transform="translate(15, 50)">
      <rect width="230" height="130" class="box" />
      <text x="12" y="22" class="box-title">Render Load Balancer</text>
      <text x="12" y="40" class="box-desc">• Terminates inbound HTTPS</text>
      <text x="12" y="56" class="box-desc">• Injects proxy headers:</text>
      <text x="20" y="72" class="box-code">X-Forwarded-For: &lt;client-ip&gt;</text>
      <text x="20" y="88" class="box-code">X-Forwarded-Proto: https</text>
      <text x="12" y="108" class="box-desc">• Forwards to Node.js container</text>
    </g>

    <!-- 2.2 -->
    <g transform="translate(15, 200)">
      <rect width="230" height="140" class="box" />
      <text x="12" y="22" class="box-title">Express trust proxy</text>
      <text x="12" y="40" class="box-desc">• app.set('trust proxy', 1)</text>
      <text x="12" y="56" class="box-desc">• Express reads true client IP</text>
      <text x="12" y="72" class="box-desc">• Critical Fix: Prevents false</text>
      <text x="12" y="88" class="box-desc">  rate-limit loops on shared</text>
      <text x="12" y="104" class="box-desc">  load-balancer IPs</text>
      <text x="12" y="124" class="box-code">app.js #L12</text>
    </g>

    <!-- 2.3 -->
    <g transform="translate(15, 360)">
      <rect width="230" height="130" class="box" />
      <text x="12" y="22" class="box-title">Rate Limiting &amp; CORS</text>
      <text x="12" y="40" class="box-desc">• Origin checked against</text>
      <text x="20" y="56" class="box-code">farm-connect-eta-ten.vercel.app</text>
      <text x="12" y="72" class="box-desc">• Rate limit checked (300/15m)</text>
      <text x="12" y="88" class="box-desc">• Passes to /api/v1 router</text>
      <text x="12" y="108" class="box-code">CORS Whitelist</text>
    </g>
  </g>
  <path d="M 595, 400 L 625, 400" class="flow-arrow" />

  <!-- ================= STAGE 3: NODE BACKEND ================= -->
  <g transform="translate(625, 95)">
    <rect width="260" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">3. NODE.JS COMPUTE</text>

    <!-- 3.1 -->
    <g transform="translate(15, 50)">
      <rect width="230" height="130" class="box" />
      <text x="12" y="22" class="box-title">Controller Processing</text>
      <text x="12" y="40" class="box-desc">• Express route matches</text>
      <text x="12" y="56" class="box-desc">• Controller validates token</text>
      <text x="12" y="72" class="box-desc">• Extracts query / body data</text>
      <text x="12" y="88" class="box-desc">• Prepares parameterised SQL</text>
      <text x="12" y="108" class="box-code">Express 5 Route</text>
    </g>

    <!-- 3.2 -->
    <g transform="translate(15, 200)">
      <rect width="230" height="140" class="box" />
      <text x="12" y="22" class="box-title">pg Connection Pool</text>
      <text x="12" y="40" class="box-desc">• Checks out client from pool</text>
      <text x="12" y="56" class="box-desc">• SSL TCP socket to Supabase</text>
      <text x="12" y="72" class="box-desc">• Connection parameters:</text>
      <text x="20" y="88" class="box-code">DATABASE_URL (SSL)</text>
      <text x="12" y="104" class="box-desc">• 2000ms fail-fast timeout</text>
      <text x="12" y="124" class="box-code">pg.Pool Client</text>
    </g>

    <!-- 3.3 -->
    <g transform="translate(15, 360)">
      <rect width="230" height="130" class="box" />
      <text x="12" y="22" class="box-title">Fast2SMS / Cloudinary</text>
      <text x="12" y="40" class="box-desc">• If OTP: HTTPS to Fast2SMS</text>
      <text x="12" y="56" class="box-desc">• If Image: Streams buffer</text>
      <text x="12" y="72" class="box-desc">  to Cloudinary CDN</text>
      <text x="12" y="88" class="box-desc">• Non-blocking async I/O</text>
      <text x="12" y="108" class="box-code">Outbound HTTPS</text>
    </g>
  </g>
  <path d="M 885, 400 L 915, 400" class="flow-arrow" />

  <!-- ================= STAGE 4: SUPABASE POSTGRESQL ================= -->
  <g transform="translate(915, 95)">
    <rect width="245" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">4. SUPABASE POSTGRESQL</text>

    <!-- 4.1 -->
    <g transform="translate(15, 50)">
      <rect width="215" height="130" class="box" />
      <text x="12" y="22" class="box-title">PostgreSQL AWS Mumbai</text>
      <text x="12" y="40" class="box-desc">• AWS ap-south-1 region</text>
      <text x="12" y="56" class="box-desc">• Ultra-low latency (&lt;20ms)</text>
      <text x="12" y="72" class="box-desc">• Parameterised SQL query</text>
      <text x="12" y="88" class="box-desc">• Executes calculate_distance</text>
      <text x="12" y="108" class="box-code">Port :5432</text>
    </g>

    <!-- 4.2 -->
    <g transform="translate(15, 200)">
      <rect width="215" height="140" class="box" />
      <text x="12" y="22" class="box-title">Row Stream Return</text>
      <text x="12" y="40" class="box-desc">• Returns matching records</text>
      <text x="12" y="56" class="box-desc">• node-postgres hydrates rows</text>
      <text x="12" y="72" class="box-desc">• Client connection returned</text>
      <text x="12" y="88" class="box-desc">  to pool immediately</text>
      <text x="12" y="104" class="box-desc">• Zero resource leaks</text>
      <text x="12" y="124" class="box-code">Rows Hydrated</text>
    </g>

    <!-- 4.3 -->
    <g transform="translate(15, 360)">
      <rect width="215" height="130" class="box" />
      <text x="12" y="22" class="box-title">HTTP JSON Response</text>
      <text x="12" y="40" class="box-desc">• Node responds with JSON</text>
      <text x="12" y="56" class="box-desc">• Render proxy streams to Vercel</text>
      <text x="12" y="72" class="box-desc">• Client React state updates</text>
      <text x="12" y="88" class="box-desc">• DOM renders fresh view</text>
      <text x="12" y="108" class="box-code">HTTP 200 Complete</text>
    </g>
  </g>

</svg>
