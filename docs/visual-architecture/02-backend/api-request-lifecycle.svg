<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stage-card { fill: #131c2e; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.05em; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 8px; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #f8fafc; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .box-code { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 600; fill: #10b981; }
      .flow-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#arrow-cyan); }
    </style>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1200" height="780" class="bg" />

  <!-- Header -->
  <text x="45" y="45" class="title">Farm Connect — API Request Lifecycle &amp; Processing Pipeline</text>
  <text x="45" y="68" class="subtitle">Complete trace of an HTTP request traversing Express middleware, route matching, database querying, and JSON serialization</text>

  <!-- ================= STAGE 1: INGESTION ================= -->
  <g transform="translate(45, 95)">
    <rect width="260" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">1. NETWORK INGESTION</text>

    <!-- Step 1.1 -->
    <g transform="translate(15, 50)">
      <rect width="230" height="100" class="box" />
      <text x="12" y="22" class="box-title">Client Dispatch</text>
      <text x="12" y="40" class="box-desc">• HTTPS Request from browser</text>
      <text x="12" y="56" class="box-desc">• Next.js Vercel CDN or Axios</text>
      <text x="12" y="72" class="box-desc">• Authorization Bearer header</text>
      <text x="120" y="22" class="box-code">TLS 1.3</text>
    </g>

    <!-- Step 1.2 -->
    <g transform="translate(15, 170)">
      <rect width="230" height="110" class="box" />
      <text x="12" y="22" class="box-title">Reverse Proxy Ingestion</text>
      <text x="12" y="40" class="box-desc">• Render Load Balancer</text>
      <text x="12" y="56" class="box-desc">• app.set('trust proxy', 1)</text>
      <text x="12" y="72" class="box-desc">• Reads X-Forwarded-For header</text>
      <text x="12" y="88" class="box-desc">• Evaluates true client IP</text>
      <text x="110" y="22" class="box-code">Port :5000</text>
    </g>

    <!-- Step 1.3 -->
    <g transform="translate(15, 300)">
      <rect width="230" height="110" class="box" />
      <text x="12" y="22" class="box-title">Security Middleware</text>
      <text x="12" y="40" class="box-desc">• helmet() headers injection</text>
      <text x="12" y="56" class="box-desc">• CORP: cross-origin</text>
      <text x="12" y="72" class="box-desc">• cors({ origin: allowedOrigins })</text>
      <text x="12" y="88" class="box-desc">• Credentials allowed</text>
      <text x="110" y="22" class="box-code">app.js #L15</text>
    </g>

    <!-- Step 1.4 -->
    <g transform="translate(15, 430)">
      <rect width="230" height="100" class="box" />
      <text x="12" y="22" class="box-title">Rate Limiting</text>
      <text x="12" y="40" class="box-desc">• express-rate-limit</text>
      <text x="12" y="56" class="box-desc">• Window: 15 mins</text>
      <text x="12" y="72" class="box-desc">• Max: 300 requests / IP</text>
      <text x="12" y="88" class="box-desc">• 429 payload if exceeded</text>
      <text x="110" y="22" class="box-code">globalLimiter</text>
    </g>

    <!-- Step 1.5 -->
    <g transform="translate(15, 550)">
      <rect width="230" height="75" class="box" />
      <text x="12" y="22" class="box-title">Body Parser &amp; Sanitize</text>
      <text x="12" y="40" class="box-desc">• express.json({ limit: '10mb' })</text>
      <text x="12" y="56" class="box-desc">• sanitizeInputs middleware</text>
    </g>
  </g>
  <path d="M 305, 400 L 335, 400" class="flow-arrow" />

  <!-- ================= STAGE 2: ROUTING & CONTROLLER ================= -->
  <g transform="translate(335, 95)">
    <rect width="260" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">2. ROUTING &amp; DISPATCH</text>

    <!-- Step 2.1 -->
    <g transform="translate(15, 50)">
      <rect width="230" height="110" class="box" />
      <text x="12" y="22" class="box-title">Express Router Match</text>
      <text x="12" y="40" class="box-desc">• Matches /api/v1/:resource</text>
      <text x="12" y="56" class="box-desc">• /auth, /products, /farmers,</text>
      <text x="12" y="72" class="box-desc">  /consumers</text>
      <text x="12" y="88" class="box-desc">• Dispatches to controller</text>
      <text x="115" y="22" class="box-code">app.js #L25</text>
    </g>

    <!-- Step 2.2 -->
    <g transform="translate(15, 180)">
      <rect width="230" height="120" class="box" />
      <text x="12" y="22" class="box-title">Controller Extraction</text>
      <text x="12" y="40" class="box-desc">• req.params (e.g. :id, :category)</text>
      <text x="12" y="56" class="box-desc">• req.query (lat, lon, radius)</text>
      <text x="12" y="72" class="box-desc">• req.body (order, phone, otp)</text>
      <text x="12" y="88" class="box-desc">• Fallback values assigned</text>
      <text x="12" y="104" class="box-desc">  (e.g. radius || 30)</text>
    </g>

    <!-- Step 2.3 -->
    <g transform="translate(15, 320)">
      <rect width="230" height="140" class="box" />
      <text x="12" y="22" class="box-title">Validation &amp; Business Rules</text>
      <text x="12" y="40" class="box-desc">• Product Search: Checks if lat</text>
      <text x="12" y="56" class="box-desc">  and lon are present</text>
      <text x="12" y="72" class="box-desc">• OTP Send: Checks if phone exists</text>
      <text x="12" y="88" class="box-desc">• Place Order: Checks consumer</text>
      <text x="12" y="104" class="box-desc">  and farmer exist in DB</text>
      <text x="12" y="120" class="box-desc">• Returns 400 if invalid</text>
    </g>

    <!-- Step 2.4 -->
    <g transform="translate(15, 480)">
      <rect width="230" height="145" class="box" />
      <text x="12" y="22" class="box-title">Service Delegation</text>
      <text x="12" y="40" class="box-desc">• If SMS needed:</text>
      <text x="12" y="56" class="box-desc">  Calls smsservice.sendOTP()</text>
      <text x="12" y="72" class="box-desc">• If Image upload:</text>
      <text x="12" y="88" class="box-desc">  Calls Cloudinary uploader</text>
      <text x="12" y="104" class="box-desc">• Prepares parameterised</text>
      <text x="12" y="120" class="box-desc">  SQL queries ($1, $2, $3)</text>
    </g>
  </g>
  <path d="M 595, 400 L 625, 400" class="flow-arrow" />

  <!-- ================= STAGE 3: DATABASE ================= -->
  <g transform="translate(625, 95)">
    <rect width="260" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">3. POSTGRESQL EXECUTION</text>

    <!-- Step 3.1 -->
    <g transform="translate(15, 50)">
      <rect width="230" height="110" class="box" />
      <text x="12" y="22" class="box-title">Client Checkout from Pool</text>
      <text x="12" y="40" class="box-desc">• pg.Pool checks out client</text>
      <text x="12" y="56" class="box-desc">• 2000ms connection timeout</text>
      <text x="12" y="72" class="box-desc">• SSL connection over TCP</text>
      <text x="12" y="88" class="box-desc">• Emits pool 'connect' event</text>
      <text x="115" y="22" class="box-code">Pool: max 10</text>
    </g>

    <!-- Step 3.2 -->
    <g transform="translate(15, 180)">
      <rect width="230" height="140" class="box" />
      <text x="12" y="22" class="box-title">SQL Query / Spatial Call</text>
      <text x="12" y="40" class="box-desc">• Parameterised execution ($1..$N)</text>
      <text x="12" y="56" class="box-desc">• Prevents SQL injection</text>
      <text x="12" y="72" class="box-desc">• Spatial queries invoke:</text>
      <text x="12" y="90" font-family="monospace" font-size="9.5" fill="#34d399">calculate_distance_km()</text>
      <text x="12" y="108" class="box-desc">• Returns distance_km alias</text>
      <text x="12" y="124" class="box-desc">• ORDER BY distance_km ASC</text>
    </g>

    <!-- Step 3.3 -->
    <g transform="translate(15, 340)">
      <rect width="230" height="140" class="box" />
      <text x="12" y="22" class="box-title">Transactions (Atomic Ops)</text>
      <text x="12" y="40" class="box-desc">• executeTransaction(callback)</text>
      <text x="12" y="56" class="box-desc">• BEGIN transaction</text>
      <text x="12" y="72" class="box-desc">• Inserts order + item snapshot</text>
      <text x="12" y="88" class="box-desc">• Updates stock_available</text>
      <text x="12" y="104" class="box-desc">• COMMIT or ROLLBACK on err</text>
      <text x="12" y="120" class="box-desc">• client.release() in finally</text>
    </g>

    <!-- Step 3.4 -->
    <g transform="translate(15, 500)">
      <rect width="230" height="125" class="box" />
      <text x="12" y="22" class="box-title">Result Rows Hydration</text>
      <text x="12" y="40" class="box-desc">• Destructures { rows } from result</text>
      <text x="12" y="56" class="box-desc">• Returns records array</text>
      <text x="12" y="72" class="box-desc">• Client connection returned</text>
      <text x="12" y="88" class="box-desc">  to pool for reuse</text>
      <text x="12" y="104" class="box-desc">• Zero connection leaks</text>
    </g>
  </g>
  <path d="M 885, 400 L 915, 400" class="flow-arrow" />

  <!-- ================= STAGE 4: RESPONSE ================= -->
  <g transform="translate(915, 95)">
    <rect width="245" height="645" class="stage-card" />
    <text x="18" y="32" class="stage-title">4. RESPONSE &amp; LOGGING</text>

    <!-- Step 4.1 -->
    <g transform="translate(15, 50)">
      <rect width="215" height="120" class="box" />
      <text x="12" y="22" class="box-title">JSON Serialization</text>
      <text x="12" y="40" class="box-desc">• res.status(200 | 201).json({</text>
      <text x="20" y="58" class="box-code">success: true,</text>
      <text x="20" y="74" class="box-code">count: rows.length,</text>
      <text x="20" y="90" class="box-code">data: rows</text>
      <text x="12" y="106" class="box-desc">})</text>
    </g>

    <!-- Step 4.2 -->
    <g transform="translate(15, 190)">
      <rect width="215" height="130" class="box" />
      <text x="12" y="22" class="box-title">HTTP Logger (Morgan)</text>
      <text x="12" y="40" class="box-desc">• Records request method,</text>
      <text x="12" y="56" class="box-desc">  path, status code, latency</text>
      <text x="12" y="72" class="box-desc">• Production: 'combined' format</text>
      <text x="12" y="88" class="box-desc">• Development: 'dev' format</text>
      <text x="12" y="108" class="box-desc">• Logs stdout to Render console</text>
    </g>

    <!-- Step 4.3 -->
    <g transform="translate(15, 340)">
      <rect width="215" height="140" class="box" />
      <text x="12" y="22" class="box-title">Client Receipt &amp; Render</text>
      <text x="12" y="40" class="box-desc">• Browser Axios client resolves</text>
      <text x="12" y="56" class="box-desc">• Updates React Context / State</text>
      <text x="12" y="72" class="box-desc">• Re-renders UI DOM elements</text>
      <text x="12" y="88" class="box-desc">• Map plots new farm markers</text>
      <text x="12" y="108" class="box-desc">• Product cards display</text>
    </g>

    <!-- Step 4.4 -->
    <g transform="translate(15, 500)">
      <rect width="215" height="125" class="box" />
      <text x="12" y="22" class="box-title">HTTP Cycle Complete</text>
      <text x="12" y="40" class="box-desc">• Socket kept alive or closed</text>
      <text x="12" y="56" class="box-desc">• Connection returned to pool</text>
      <text x="12" y="72" class="box-desc">• Total round-trip latency:</text>
      <text x="12" y="88" class="box-desc">  typically 40ms - 120ms</text>
      <text x="12" y="108" class="box-code">Status: COMPLETED</text>
    </g>
  </g>

</svg>
