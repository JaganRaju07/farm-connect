<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#090d16;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="rootCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <linearGradient id="modularCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <linearGradient id="dbCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>
  <rect width="1600" height="1150" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Blueprint Lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="1150"/>
    <line x1="500" y1="0" x2="500" y2="1150"/>
    <line x1="950" y1="0" x2="950" y2="1150"/>
    <line x1="1300" y1="0" x2="1300" y2="1150"/>
    <line x1="0" y1="130" x2="1600" y2="130"/>
    <line x1="0" y1="650" x2="1600" y2="650"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1480" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="45" cy="37" r="20" fill="#10b981" fill-opacity="0.2"/>
    <text x="45" y="43" fill="#10b981" font-size="16" font-weight="700" text-anchor="middle">JS</text>
    
    <text x="80" y="34" fill="#f8fafc" font-size="22" font-weight="700">BACKEND SOURCE CODE REPOSITORY MAP</text>
    <text x="80" y="56" fill="#94a3b8" font-size="13">Detailed structural layout, dual backend architectures, route dispatchers, controllers, services, and shared database scripts</text>

    <rect x="1230" y="22" width="220" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="1340" y="42" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">DUAL-RUNTIME AUDITED</text>
  </g>

  <!-- ROOT VS MODULAR ARCHITECTURE NOTICE -->
  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="1480" height="35" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="22" fill="#fbbf24" font-size="12" font-weight="700">⚠️ DUAL BACKEND ARCHITECTURE DETECTED:</text>
    <text x="310" y="22" fill="#94a3b8" font-size="12">Root <tspan fill="#34d399">/src</tspan> serves core marketplace &amp; auth on Port 5000 • Subfolder <tspan fill="#38bdf8">/backend/src</tspan> provides extended modular micro-services on Port 4000</text>
  </g>

  <!-- SECTION 1: ROOT BACKEND (src/ & server.js) -->
  <g transform="translate(60, 185)">
    <rect x="0" y="0" width="720" height="890" rx="12" fill="url(#rootCardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="720" height="42" rx="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="20" y="27" fill="#34d399" font-size="15" font-weight="700">📁 ROOT BACKEND: server.js &amp; src/ (Port 5000 Core Services)</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 55)">
      <!-- Entry Point & Config -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="680" height="75" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#34d399" font-size="12" font-weight="700">SERVER ENTRY &amp; DATABASE CONFIGURATION</text>
        <text x="15" y="42" fill="#e2e8f0" font-size="11" font-family="monospace">server.js</text>
        <text x="120" y="42" fill="#94a3b8" font-size="11">— HTTP listener, port fallback (process.env.PORT || 5000), error shutdown</text>
        <text x="15" y="60" fill="#e2e8f0" font-size="11" font-family="monospace">src/app.js</text>
        <text x="120" y="60" fill="#94a3b8" font-size="11">— Express instance, helmet, CORS whitelist, rate-limiter, route mounting</text>
        <text x="360" y="60" fill="#e2e8f0" font-size="11" font-family="monospace">src/config/db.js</text>
        <text x="475" y="60" fill="#94a3b8" font-size="11">— pg.Pool connection</text>
      </g>

      <!-- Routes (src/routes/) -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="680" height="150" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#34d399" font-size="12" font-weight="700">📁 src/routes/ — Express Router Dispatchers</text>
        
        <text x="15" y="48" fill="#38bdf8" font-size="11" font-family="monospace">authroutes.js</text>
        <text x="140" y="48" fill="#94a3b8" font-size="11">POST /send-otp, POST /verify-otp, POST /refresh-token</text>

        <text x="15" y="74" fill="#38bdf8" font-size="11" font-family="monospace">farmerroutes.js</text>
        <text x="140" y="74" fill="#94a3b8" font-size="11">GET /profile, PUT /profile, GET /dashboard/stats, GET /orders</text>

        <text x="15" y="100" fill="#38bdf8" font-size="11" font-family="monospace">productroutes.js</text>
        <text x="140" y="100" fill="#94a3b8" font-size="11">GET / (nearby search), GET /:id, POST /create, PUT /:id, DELETE /:id</text>

        <text x="15" y="126" fill="#38bdf8" font-size="11" font-family="monospace">consumerroutes.js</text>
        <text x="140" y="126" fill="#94a3b8" font-size="11">GET /orders, POST /orders, GET /nearby-farmers</text>
      </g>

      <!-- Controllers (src/controllers/) -->
      <g transform="translate(0, 255)">
        <rect x="0" y="0" width="680" height="235" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#34d399" font-size="12" font-weight="700">📁 src/controllers/ — Request Handlers &amp; Business Logic</text>

        <g transform="translate(15, 35)">
          <text x="0" y="16" fill="#f8fafc" font-size="11.5" font-weight="600">authController.js</text>
          <text x="0" y="32" fill="#94a3b8" font-size="10.5">• sendOTP(): Deduplicates in otp_store, generates 6-digit code, triggers SMS</text>
          <text x="0" y="47" fill="#94a3b8" font-size="10.5">• verifyOTP(): Validates TTL, inserts user on first login, signs JWT token</text>
        </g>
        <line x1="15" y1="95" x2="665" y2="95" stroke="#1e293b" stroke-width="0.8"/>

        <g transform="translate(15, 105)">
          <text x="0" y="16" fill="#f8fafc" font-size="11.5" font-weight="600">productController.js</text>
          <text x="0" y="32" fill="#94a3b8" font-size="10.5">• searchNearbyProducts(): Invokes calculate_distance_km() spatial filter</text>
          <text x="0" y="47" fill="#94a3b8" font-size="10.5">• createProduct() / updateProduct(): Stock validation &amp; active crop toggle</text>
        </g>
        <line x1="15" y1="165" x2="665" y2="165" stroke="#1e293b" stroke-width="0.8"/>

        <g transform="translate(15, 175)">
          <text x="0" y="16" fill="#f8fafc" font-size="11.5" font-weight="600">consumerController.js &amp; farmerController.js</text>
          <text x="0" y="32" fill="#94a3b8" font-size="10.5">• createOrder(): Distance calculation, frozen JSONB line items, order generation</text>
          <text x="0" y="47" fill="#94a3b8" font-size="10.5">• updateOrderStatus(): State transitions (pending → confirmed → delivered)</text>
        </g>
      </g>

      <!-- Services & Middleware -->
      <g transform="translate(0, 505)">
        <rect x="0" y="0" width="680" height="280" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#34d399" font-size="12" font-weight="700">📁 src/services/ &amp; src/middleware/</text>

        <!-- Services -->
        <g transform="translate(15, 38)">
          <text x="0" y="14" fill="#a78bfa" font-size="11" font-weight="700">SERVICES LAYER</text>
          
          <text x="0" y="34" fill="#e2e8f0" font-size="11" font-family="monospace">smsservice.js</text>
          <text x="130" y="34" fill="#94a3b8" font-size="10.5">Fast2SMS Bulk V2 HTTP client with mock stdout fallback</text>

          <text x="0" y="56" fill="#e2e8f0" font-size="11" font-family="monospace">otpservice.js</text>
          <text x="130" y="56" fill="#94a3b8" font-size="10.5">Crypto-secure 6-digit number generator + 5-minute expiration</text>

          <text x="0" y="78" fill="#e2e8f0" font-size="11" font-family="monospace">geoservice.js</text>
          <text x="130" y="78" fill="#94a3b8" font-size="10.5">Mathematical spherical distance (R=6371km) &amp; bounding box</text>
        </g>

        <line x1="15" y1="135" x2="665" y2="135" stroke="#1e293b" stroke-width="0.8"/>

        <!-- Middleware -->
        <g transform="translate(15, 150)">
          <text x="0" y="14" fill="#fbbf24" font-size="11" font-weight="700">MIDDLEWARE PIPELINE</text>
          
          <text x="0" y="34" fill="#e2e8f0" font-size="11" font-family="monospace">authMiddleware.js</text>
          <text x="140" y="34" fill="#94a3b8" font-size="10.5">Bearer JWT verification + role-based guard (farmer / consumer)</text>

          <text x="0" y="56" fill="#e2e8f0" font-size="11" font-family="monospace">errorHandler.js</text>
          <text x="140" y="56" fill="#94a3b8" font-size="10.5">Standardized JSON error envelope (status, message, stack)</text>

          <text x="0" y="78" fill="#e2e8f0" font-size="11" font-family="monospace">validate.js</text>
          <text x="140" y="78" fill="#94a3b8" font-size="10.5">Request body sanitization and required field validation</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 2: MODULAR BACKEND (backend/src/) & DATABASE -->
  <g transform="translate(820, 185)">
    <!-- Modular Backend Box -->
    <rect x="0" y="0" width="720" height="520" rx="12" fill="url(#modularCardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="720" height="42" rx="12" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="20" y="27" fill="#38bdf8" font-size="15" font-weight="700">📁 MODULAR BACKEND: backend/src/ (Port 4000 Extended Services)</text>

    <g transform="translate(20, 55)">
      <!-- Server & App -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="680" height="55" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#38bdf8" font-size="11.5" font-weight="700">SERVER &amp; APP MODULES</text>
        <text x="15" y="40" fill="#e2e8f0" font-size="11" font-family="monospace">backend/src/server.js &amp; backend/src/app.js</text>
        <text x="320" y="40" fill="#94a3b8" font-size="11">— Port 4000 micro-routing engine</text>
      </g>

      <!-- Modular Routes -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="680" height="150" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#38bdf8" font-size="11.5" font-weight="700">📁 backend/src/routes/ — Extended Feature Endpoints</text>

        <text x="15" y="45" fill="#34d399" font-size="11" font-family="monospace">review.routes.js</text>
        <text x="160" y="45" fill="#94a3b8" font-size="11">POST /reviews, GET /products/:id/reviews, GET /farmers/:id/rating</text>

        <text x="15" y="68" fill="#34d399" font-size="11" font-family="monospace">wishlist.routes.js</text>
        <text x="160" y="68" fill="#94a3b8" font-size="11">GET /wishlist, POST /wishlist/toggle, DELETE /wishlist/:id</text>

        <text x="15" y="91" fill="#34d399" font-size="11" font-family="monospace">notification.routes.js</text>
        <text x="160" y="91" fill="#94a3b8" font-size="11">GET /notifications, PUT /notifications/:id/read, POST /push</text>

        <text x="15" y="114" fill="#34d399" font-size="11" font-family="monospace">upload.routes.js</text>
        <text x="160" y="114" fill="#94a3b8" font-size="11">POST /upload/image (Cloudinary upload pipeline)</text>

        <text x="15" y="137" fill="#34d399" font-size="11" font-family="monospace">admin.routes.js</text>
        <text x="160" y="137" fill="#94a3b8" font-size="11">GET /admin/metrics, PUT /admin/farmers/:id/verify</text>
      </g>

      <!-- Modular Controllers & Storage -->
      <g transform="translate(0, 235)">
        <rect x="0" y="0" width="680" height="195" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#38bdf8" font-size="11.5" font-weight="700">📁 backend/src/controllers/ &amp; Storage Integrations</text>

        <g transform="translate(15, 35)">
          <text x="0" y="16" fill="#f8fafc" font-size="11" font-weight="600">upload.controller.js &amp; upload.middleware.js</text>
          <text x="0" y="32" fill="#94a3b8" font-size="10.5">• Multer memoryStorage: Ingests 5MB multipart buffers without disk write</text>
          <text x="0" y="47" fill="#94a3b8" font-size="10.5">• Cloudinary uploader: Streams direct to 'farm-connect/products' cloud folder</text>
        </g>
        <line x1="15" y1="95" x2="665" y2="95" stroke="#1e293b" stroke-width="0.8"/>

        <g transform="translate(15, 105)">
          <text x="0" y="16" fill="#f8fafc" font-size="11" font-weight="600">review.controller.js &amp; admin.controller.js</text>
          <text x="0" y="32" fill="#94a3b8" font-size="10.5">• Aggregates 1-5 star customer ratings and recalculates farmer trust score</text>
          <text x="0" y="47" fill="#94a3b8" font-size="10.5">• Platform-wide SQL aggregations: total GMV, active farmers, pending orders</text>
        </g>
      </g>
    </g>

    <!-- SECTION 3: SHARED DATABASE TIER -->
    <g transform="translate(0, 545)">
      <rect x="0" y="0" width="720" height="345" rx="12" fill="url(#dbCardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="720" height="42" rx="12" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="20" y="27" fill="#fbbf24" font-size="15" font-weight="700">📁 SHARED DATABASE TIER: Supabase PostgreSQL &amp; PL/pgSQL</text>

      <g transform="translate(20, 55)">
        <rect x="0" y="0" width="680" height="265" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
        
        <text x="15" y="22" fill="#fbbf24" font-size="12" font-weight="700">DATABASE SCHEMAS &amp; PROCEDURES</text>

        <g transform="translate(15, 35)">
          <text x="0" y="14" fill="#34d399" font-size="11" font-family="monospace">Supabase Remote DDL</text>
          <text x="180" y="14" fill="#94a3b8" font-size="10.5">8 Core Tables: farmers, consumers, products, orders, otp_store, product_reviews, consumer_wishlist, notifications</text>

          <text x="0" y="40" fill="#38bdf8" font-size="11" font-family="monospace">calculate_distance_km()</text>
          <text x="180" y="40" fill="#94a3b8" font-size="10.5">PL/pgSQL Haversine function: $R \times \arccos(\sin \phi_1 \sin \phi_2 + \cos \phi_1 \cos \phi_2 \cos \Delta \lambda)$</text>

          <text x="0" y="66" fill="#a78bfa" font-size="11" font-family="monospace">Foreign Keys &amp; Indexes</text>
          <text x="180" y="66" fill="#94a3b8" font-size="10.5">products(farmer_id), orders(consumer_id, farmer_id), spatial compound lat/lng indexes</text>

          <text x="0" y="92" fill="#f59e0b" font-size="11" font-family="monospace">JSONB Snapshot Schema</text>
          <text x="180" y="92" fill="#94a3b8" font-size="10.5">orders.items JSONB column locks unit price and product snapshot at purchase time</text>

          <text x="0" y="118" fill="#e2e8f0" font-size="11" font-family="monospace">OTP Lifecycle Constraints</text>
          <text x="180" y="118" fill="#94a3b8" font-size="10.5">otp_store UNIQUE(phone), expires_at TIMESTAMP WITH TIME ZONE (5-min enforce)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1090)">
    <rect x="0" y="0" width="1480" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="20" r="4" fill="#10b981"/>
    <text x="35" y="24" fill="#94a3b8" font-size="11">Architecture verification: All files located under D:\farm-connect\src and D:\farm-connect\backend\src. Dual-backend architecture verified.</text>
    <text x="1450" y="24" fill="#64748b" font-size="11" text-anchor="end">Farm Connect Visual Architecture Atlas • 06-code-tracing/backend-source-map.svg</text>
  </g>
</svg>
