<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .section-card { fill: #131c2e; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.05em; }
      .tech-card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .tech-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .tech-ver { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-weight: 600; fill: #10b981; }
      .tech-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .env-badge { fill: #0284c7; rx: 4px; }
      .env-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="750" class="bg" />

  <!-- Title -->
  <text x="45" y="45" class="header-title">Farm Connect — Technology Stack &amp; Service Map</text>
  <text x="45" y="68" class="header-sub">Verified runtime dependencies, third-party cloud services, protocols, and environment configurations</text>

  <!-- ================= SECTION 1: FRONTEND RUNTIME ================= -->
  <g transform="translate(45, 95)">
    <rect width="350" height="610" class="section-card" />
    <text x="20" y="32" class="section-title">FRONTEND STACK (VERCEL EDGE)</text>

    <!-- Next.js -->
    <g transform="translate(18, 50)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Next.js (App Router)</text>
      <text x="210" y="24" class="tech-ver">v16.2.4</text>
      <text x="14" y="44" class="tech-role">React framework with SSR &amp; static optimization</text>
    </g>

    <!-- React -->
    <g transform="translate(18, 120)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">React &amp; React DOM</text>
      <text x="210" y="24" class="tech-ver">v19.2.4</text>
      <text x="14" y="44" class="tech-role">Component tree, Context API, React 19 hooks</text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(18, 190)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Tailwind CSS</text>
      <text x="210" y="24" class="tech-ver">v3.4.4</text>
      <text x="14" y="44" class="tech-role">Utility-first CSS, dark-mode styling, Outfit font</text>
    </g>

    <!-- Leaflet -->
    <g transform="translate(18, 260)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Leaflet &amp; React-Leaflet</text>
      <text x="210" y="24" class="tech-ver">v1.9.4 / v5.0.0</text>
      <text x="14" y="44" class="tech-role">Interactive OpenStreetMap discovery viewer</text>
    </g>

    <!-- Animation: Framer + GSAP -->
    <g transform="translate(18, 330)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Framer Motion &amp; GSAP</text>
      <text x="210" y="24" class="tech-ver">v12.43 / v3.15</text>
      <text x="14" y="44" class="tech-role">Micro-interactions, staggered grid transitions</text>
    </g>

    <!-- Axios & Validation -->
    <g transform="translate(18, 400)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Axios &amp; Zod Validation</text>
      <text x="210" y="24" class="tech-ver">v1.15.0 / v4.3.6</text>
      <text x="14" y="44" class="tech-role">HTTP client with interceptor + schema validation</text>
    </g>

    <!-- Frontend Env -->
    <g transform="translate(18, 480)">
      <rect width="314" height="100" fill="#0f172a" stroke="#0284c7" stroke-width="1" rx="6" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">FRONTEND CONFIGURATION</text>
      <text x="12" y="44" font-family="monospace" font-size="10" fill="#94a3b8">• NEXT_PUBLIC_API_URL</text>
      <text x="12" y="64" font-family="monospace" font-size="10" fill="#94a3b8">• next.config.ts remotePatterns</text>
      <text x="12" y="84" font-family="monospace" font-size="10" fill="#94a3b8">  (res.cloudinary.com, unsplash.com)</text>
    </g>
  </g>

  <!-- ================= SECTION 2: BACKEND RUNTIME ================= -->
  <g transform="translate(425, 95)">
    <rect width="350" height="610" class="section-card" />
    <text x="20" y="32" class="section-title">BACKEND STACK (RENDER HOST)</text>

    <!-- Node & Express -->
    <g transform="translate(18, 50)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Express.js (Node.js)</text>
      <text x="210" y="24" class="tech-ver">v5.2.1 / v4.19.2</text>
      <text x="14" y="44" class="tech-role">REST API Router, trust proxy = 1, JSON parsing</text>
    </g>

    <!-- pg (PostgreSQL Client) -->
    <g transform="translate(18, 120)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">pg (node-postgres)</text>
      <text x="210" y="24" class="tech-ver">v8.20.0</text>
      <text x="14" y="44" class="tech-role">Connection pool, executeTransaction helper</text>
    </g>

    <!-- Security & Headers -->
    <g transform="translate(18, 190)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Helmet &amp; CORS</text>
      <text x="210" y="24" class="tech-ver">v8.1.0 / v2.8.6</text>
      <text x="14" y="44" class="tech-role">crossOriginResourcePolicy, origin whitelist</text>
    </g>

    <!-- Rate Limiting -->
    <g transform="translate(18, 260)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">express-rate-limit</text>
      <text x="210" y="24" class="tech-ver">v7.2.0</text>
      <text x="14" y="44" class="tech-role">300 req / 15m window, standardHeaders</text>
    </g>

    <!-- Auth: JWT & Bcrypt -->
    <g transform="translate(18, 330)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">jsonwebtoken &amp; bcrypt</text>
      <text x="210" y="24" class="tech-ver">v9.0.3 / v6.0.0</text>
      <text x="14" y="44" class="tech-role">HMAC SHA256 JWT tokens with 30-day validity</text>
    </g>

    <!-- Logging & Upload -->
    <g transform="translate(18, 400)">
      <rect width="314" height="60" class="tech-card" />
      <text x="14" y="24" class="tech-name">Morgan &amp; Multer</text>
      <text x="210" y="24" class="tech-ver">v1.10.0 / v1.4.5</text>
      <text x="14" y="44" class="tech-role">HTTP request logger + multipart image upload</text>
    </g>

    <!-- Backend Env -->
    <g transform="translate(18, 480)">
      <rect width="314" height="100" fill="#0f172a" stroke="#10b981" stroke-width="1" rx="6" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">BACKEND CONFIGURATION</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94a3b8">• PORT, NODE_ENV, ALLOWED_ORIGINS</text>
      <text x="12" y="60" font-family="monospace" font-size="10" fill="#94a3b8">• DATABASE_URL, JWT_SECRET</text>
      <text x="12" y="78" font-family="monospace" font-size="10" fill="#94a3b8">• FAST2SMS_API_KEY, CLOUDINARY_URL</text>
    </g>
  </g>

  <!-- ================= SECTION 3: CLOUD INFRASTRUCTURE ================= -->
  <g transform="translate(805, 95)">
    <rect width="350" height="610" class="section-card" />
    <text x="20" y="32" class="section-title">CLOUD SERVICES &amp; PROTOCOLS</text>

    <!-- Supabase -->
    <g transform="translate(18, 50)">
      <rect width="314" height="85" class="tech-card" />
      <text x="14" y="24" class="tech-name">Supabase PostgreSQL</text>
      <text x="210" y="24" class="tech-ver">Postgres 15</text>
      <text x="14" y="44" class="tech-role">Managed relational DB with SSL connection</text>
      <text x="14" y="64" class="tech-role">Protocol: TCP PostgreSQL Wire Protocol (:5432)</text>
    </g>

    <!-- Fast2SMS -->
    <g transform="translate(18, 145)">
      <rect width="314" height="85" class="tech-card" />
      <text x="14" y="24" class="tech-name">Fast2SMS Bulk Gateway</text>
      <text x="210" y="24" class="tech-ver">Bulk V2 API</text>
      <text x="14" y="44" class="tech-role">SMS delivery for 6-digit verification codes</text>
      <text x="14" y="64" class="tech-role">Protocol: HTTPS GET /dev/bulkV2</text>
    </g>

    <!-- Cloudinary -->
    <g transform="translate(18, 240)">
      <rect width="314" height="85" class="tech-card" />
      <text x="14" y="24" class="tech-name">Cloudinary CDN</text>
      <text x="210" y="24" class="tech-ver">Media CDN</text>
      <text x="14" y="44" class="tech-role">Cloud photo storage &amp; image optimization</text>
      <text x="14" y="64" class="tech-role">Protocol: HTTPS Multipart POST / SDK</text>
    </g>

    <!-- Vercel Edge -->
    <g transform="translate(18, 335)">
      <rect width="314" height="85" class="tech-card" />
      <text x="14" y="24" class="tech-name">Vercel Edge Platform</text>
      <text x="210" y="24" class="tech-ver">Edge Host</text>
      <text x="14" y="44" class="tech-role">Global CDN distribution for Next.js app</text>
      <text x="14" y="64" class="tech-role">Protocol: HTTPS / HTTP2 / TLS 1.3</text>
    </g>

    <!-- Render -->
    <g transform="translate(18, 430)">
      <rect width="314" height="85" class="tech-card" />
      <text x="14" y="24" class="tech-name">Render Web Service</text>
      <text x="210" y="24" class="tech-ver">Node Runtime</text>
      <text x="14" y="44" class="tech-role">Containerized Express backend host</text>
      <text x="14" y="64" class="tech-role">Protocol: HTTPS Reverse Proxy (trust proxy=1)</text>
    </g>

    <!-- OpenStreetMap -->
    <g transform="translate(18, 525)">
      <rect width="314" height="70" class="tech-card" />
      <text x="14" y="24" class="tech-name">OpenStreetMap / CARTO</text>
      <text x="210" y="24" class="tech-ver">Tile Server</text>
      <text x="14" y="44" class="tech-role">Raster map tiles rendered in Leaflet map</text>
    </g>
  </g>

</svg>
