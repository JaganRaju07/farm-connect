name: Deploy Farm Connect Architecture Atlas

on:
  push:
    branches:
      - main
    paths:
      - "docs/visual-architecture/**"
      - ".github/workflows/deploy-architecture-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload architecture atlas
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/visual-architecture

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
