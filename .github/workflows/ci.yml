name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Syntax, Dependencies & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify backend JavaScript syntax
        run: |
          find backend/src src -name "*.js" -exec node --check {} +
          node --check backend/tests/integration.test.js
          node --check backend/tests/security_remediation.test.js
          node --check server.js
          node --check test_demo_flow.js

      - name: Run automated security & auth unit tests
        run: npm --prefix backend test
        env:
          JWT_SECRET: ci_test_secret_for_validation_only
          JWT_EXPIRES_IN: 1h

      - name: Note on database integration tests
        run: |
          echo "Notice: Database integration tests (backend/tests/integration.test.js) require a live PostgreSQL database instance with PostGIS/Haversine functions."
          echo "Database-backed integration tests are skipped in stateless CI runners to prevent false positives."

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify TypeScript & Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: https://farm-connect-eta-ten.vercel.app
        run: npm --prefix frontend run build
