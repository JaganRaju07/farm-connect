version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: farmconnect-db
    environment:
      POSTGRES_DB: farmconnect
      POSTGRES_USER: farmconnect_user
      POSTGRES_PASSWORD: farmconnect_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

volumes:
  postgres_data: